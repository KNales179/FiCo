<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Self-repair after an update: if this page is an old saved copy whose
      // code files no longer exist (a white screen), drop the outdated saved
      // copy and reload once. Only the app's cached files are cleared, never
      // your records or unsynced changes (those live in IndexedDB).
      (function () {
        var KEY = 'fico.selfRepairAt'
        function repair() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0)
            if (Date.now() - last < 60000) return // tried a moment ago: don't loop
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (e) {}
          var done = function () { location.reload() }
          var regs = navigator.serviceWorker && navigator.serviceWorker.getRegistrations
            ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              })
            : Promise.resolve()
          regs
            .then(function () {
              return window.caches
                ? caches.keys().then(function (ks) {
                    return Promise.all(ks.filter(function (k) { return k.indexOf('workbox') === 0 }).map(function (k) { return caches.delete(k) }))
                  })
                : null
            })
            .then(done, done)
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          var src = t && (t.src || t.href)
          if (src && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && src.indexOf('/assets/') !== -1) repair()
        }, true)
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#863bff" />
    <meta name="description" content="Your Daily Financial Companion" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fico" />
    <title>Fico — Your Daily Financial Companion</title>
    <script>
      // Applied before anything paints, so a saved theme/palette/font-size
      // preference never flashes the default first (Settings page).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('fico.appearance') || '{}')
          var root = document.documentElement
          if (saved.theme === 'light' || saved.theme === 'dark') {
            root.setAttribute('data-theme', saved.theme)
          }
          if (saved.palette === 'custom') {
            // Same light/dark versions as src/features/theme/color.ts.
            var hex = saved.customColor
            if (/^#[0-9a-f]{6}$/i.test(hex || '')) {
              var rgb = function (h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255] }
              var lum = function (h) {
                var c = rgb(h).map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4) })
                return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
              }
              var mix = function (h, to, t) {
                var a = rgb(h), b = rgb(to)
                return '#' + a.map(function (v, i) { return ('0' + Math.round(v + (b[i] - v) * t).toString(16)).slice(-2) }).join('')
              }
              var ink = function (h) { return lum(h) > 0.45 ? '#1a1626' : '#ffffff' }
              var light = lum(hex) > 0.6 ? mix(hex, '#000000', 0.25) : hex
              var dark = lum(hex) < 0.18 ? mix(hex, '#ffffff', 0.35) : hex
              var l = '--brand: ' + light + '; --brand-ink: ' + ink(light) + ';'
              var d = '--brand: ' + dark + '; --brand-ink: ' + ink(dark) + ';'
              var style = document.createElement('style')
              style.id = 'fico-custom-palette'
              style.textContent =
                ':root[data-palette="custom"] { ' + l + ' }' +
                '@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-palette="custom"] { ' + d + ' } }' +
                ':root[data-theme="dark"][data-palette="custom"] { ' + d + ' }'
              document.head.appendChild(style)
              root.setAttribute('data-palette', 'custom')
            }
          } else if (saved.palette && saved.palette !== 'purple') {
            root.setAttribute('data-palette', saved.palette)
          }
          if (saved.fontSize && saved.fontSize !== 'md') {
            root.setAttribute('data-font-size', saved.fontSize)
          }
          var fonts = {
            manrope: "'Manrope Variable'", outfit: "'Outfit Variable'", lexend: "'Lexend Variable'",
            inter: "'Inter Variable'", plex: "'IBM Plex Sans Variable'", source: "'Source Sans 3 Variable'",
            dmsans: "'DM Sans Variable'", nunito: "'Nunito Variable'", quicksand: "'Quicksand Variable'",
            fredoka: "'Fredoka Variable'", baloo: "'Baloo 2 Variable'", comic: "'Comic Neue'",
            patrick: "'Patrick Hand'", system: 'system-ui',
            poppins: "'Poppins', system-ui, sans-serif", montserrat: "'Montserrat Variable', system-ui, sans-serif", figtree: "'Figtree Variable', system-ui, sans-serif", worksans: "'Work Sans Variable', system-ui, sans-serif", atkinson: "'Atkinson Hyperlegible Next Variable', system-ui, sans-serif", spacegrotesk: "'Space Grotesk Variable', system-ui, sans-serif", rubik: "'Rubik Variable', system-ui, sans-serif", caveat: "'Caveat Variable', cursive", lora: "'Lora Variable', Georgia, serif", jetbrains: "'JetBrains Mono Variable', ui-monospace, monospace", pacifico: "'Pacifico', cursive", bangers: "'Bangers', system-ui, sans-serif", marker: "'Permanent Marker', cursive", pixel: "'Press Start 2P', ui-monospace, monospace", creepster: "'Creepster', system-ui, sans-serif"
          }
          if (saved.font && fonts[saved.font]) {
            root.style.setProperty('--font-ui', fonts[saved.font] + ', system-ui, sans-serif')
          }
          if (saved.density && saved.density !== 'comfortable') {
            root.setAttribute('data-density', saved.density)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
